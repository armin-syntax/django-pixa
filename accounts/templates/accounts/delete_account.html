{% extends 'base.html' %}
{% load static %}

{% block title %}Delete Account{% endblock %}

{% block extra_header %}
<link href="{% static 'accounts/css/auth.css' %}" rel="stylesheet">
{% endblock %}

{% block content %}

<main class="auth-wrap">
  <section class="auth-card">
    <div class="eyebrow">Account</div>
    <h1>Delete account</h1>
    <p class="sub">This action cannot be undone. Your profile, photos and saved items will be removed.</p>

    <form action="" method="POST">
      <!-- <div class="errors-container">
        <div class="alert alert-danger">Error message</div>
      </div> -->

      <button class="btn btn-danger full" type="submit">Delete account</button>
      <a class="btn btn-outline full mt-2" href="{{ request.user.get_profile_url }}">Cancel</a>
    </form>
  </section>
</main>

{% endblock %}
