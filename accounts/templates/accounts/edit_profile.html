{% extends 'base.html' %}
{% load static %}

{% block title %}Edit Profile{% endblock %}

{% block extra_header %}
<link href="{% static 'accounts/css/edit_profile.css' %}" rel="stylesheet">
{% endblock %}

{% block content %}

<main class="edit-profile">
  <section class="edit-profile-card">
    <div class="edit-profile-heading">
      <div class="eyebrow">Account</div>
      <h1>Edit profile</h1>
      <p>Update your profile information.</p>
    </div>

    <div class="profile-photo-section">
      <div class="profile-photo">
        <img id="profile-preview" src="assets/images/1.jpg" alt="Profile picture">
      </div>
      <div class="profile-photo-actions">
        <input id="profile-image" name="profile_image" type="file" accept="image/*" hidden="">
        <label for="profile-image" class="photo-action add" aria-label="Change profile picture" title="Change profile picture">+</label>
        <a href="{{ request.user.get_avatar_delete_url }}" class="photo-action remove" aria-label="Delete profile picture" title="Delete profile picture">−</a>
      </div>
    </div>

    <form action="" method="POST" class="edit-profile-form" enctype="multipart/form-data">
      <!-- <div class="errors-container">
        <div class="alert alert-danger">Error message</div>
      </div> -->
      
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" name="username" class="field" type="text" value="armin.syntax" maxlength="30" required="" placeholder="Enter your username">
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" name="email" class="field" type="email" value="armin@example.com" required="" placeholder="Enter your email address">
      </div>

      <div class="form-group">
        <label for="full_name">Full name</label>
        <input id="full_name" name="full_name" class="field" type="text" value="Armin Emami" maxlength="100" placeholder="Enter your full name">
      </div>

      <div class="form-group">
        <div class="label-row">
          <label for="bio">Bio</label>
          <span id="bio-count" class="counter">0 / 500</span>
        </div>
        <textarea id="bio" name="bio" class="field" maxlength="500" placeholder="Write a short bio...">Designer, photographer and lover of quiet places.</textarea>
      </div>

      <div class="form-actions">
        <a href="{{ request.user.get_profile_url }}" class="btn btn-outline">Cancel</a>
        <button type="submit" class="btn btn-red">Save changes</button>
      </div>
    </form>
  </section>
</main>

{% block extra_body %}
<script src="{% static 'accounts/js/edit_profile.js' %}"></script>
{% endblock %}
{% endblock %}
