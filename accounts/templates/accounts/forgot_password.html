{% extends 'base.html' %}
{% load static %}

{% block title %}Forgot Password{% endblock %}

{% block extra_header %}
<link href="{% static 'accounts/css/auth.css' %}" rel="stylesheet">
{% endblock %}

{% block content %}

<main class="auth-wrap">
  <section class="auth-card">
    <div class="eyebrow">Account recovery</div>
    <h1>Forgot your password?</h1>
    <p class="sub">Enter your username or email and we'll help you reset it.</p>
    
    <form action="" method="POST">
      <!-- <div class="errors-container">
        <div class="alert alert-danger">Error message</div>
      </div> -->

      <div class="form-group">
        <label for="identity">Username or email</label>
        <input id="identity" name="identity" class="field" type="text" placeholder="Username or email" autocomplete="username" required="">
      </div>

      <button class="btn btn-red full" type="submit">Continue</button>
    </form>

    <div class="auth-foot">
      <a href="{% url 'accounts:user-login' %}">Back to sign in</a>
    </div>
  </section>
</main>

{% endblock %}
