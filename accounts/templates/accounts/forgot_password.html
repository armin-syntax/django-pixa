    <main class="auth-wrap">

        <h1>Forgot your password?</h1>
        <p class="sub">Enter your username or email and we'll help you reset it.</p>
        <form action="verify_code.html" method="POST">
          <!-- <div class="errors-container"><div class="alert alert-danger">Error message</div><div class="alert alert-info">Information message</div></div> -->
          <div class="form-group">
            <label for="identity">Username or email</label>
            <input id="identity" name="identity" class="field" type="text" placeholder="Username or email" autocomplete="username" required="">
          </div>
          <button class="btn btn-red full" type="submit">Continue</button>
        </form>
        <div class="auth-foot">
          <a href="login.html">Back to sign in</a>
        </div>
