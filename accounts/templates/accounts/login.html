{% extends 'base.html' %}
{% load static %}

{% block title %}Login{% endblock %}

{% block extra_header %}
<link href="{% static 'accounts/css/auth.css' %}" rel="stylesheet">
{% endblock %}

{% block content %}

<main class="auth-wrap">
  <section class="auth-card">
    <div class="eyebrow">Welcome back</div>
    <h1>Sign in</h1>
    <p class="sub">Sign in to continue to your collection.</p>
    
    <form action="" method="POST">
      <!-- <div class="errors-container">
        <div class="alert alert-danger">Error message</div>
      </div> -->

      <div class="form-group">
        <label for="identity">Username or email</label>
        <input id="identity" name="identity" class="field" type="text" placeholder="Username or email" autocomplete="username" required="">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" name="password" class="field" type="password" placeholder="Your password" autocomplete="current-password" required="">
      </div>

      <div class="form-links">
        <a href="{% url 'accounts:user-forgot-password' %}">Forgot password?</a>
      </div>

      <button class="btn btn-red full" type="submit">Sign in</button>
    </form>

    <div class="auth-foot">
      Don't have an account?
      <a href="{% url 'accounts:user-register' %}">Create one</a>
    </div>
  </section>
</main>

{% endblock %}
