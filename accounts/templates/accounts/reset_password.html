{% extends 'base.html' %}
{% load static %}

{% block title %}Reset Password{% endblock %}

{% block extra_header %}
<link href="{% static 'accounts/css/auth.css' %}" rel="stylesheet">
{% endblock %}

{% block content %}

<main class="auth-wrap">
  <section class="auth-card">
    <div class="eyebrow">Almost there</div>
    <h1>Create a new password</h1>
    <p class="sub">Choose a new password for your account.</p>
    
    <form action="" method="POST">
      <!-- <div class="errors-container">
        <div class="alert alert-danger">Error message</div>
      </div> -->
      
      <div class="form-group">
        <label for="new-password">New password</label>
        <input id="new-password" name="new_password" class="field" type="password" minlength="8" placeholder="Enter your password" autocomplete="new-password" required="">
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirm password</label>
        <input id="confirm-password" name="confirm_password" class="field" type="password" minlength="8" placeholder="Confirm your password" autocomplete="new-password" required="">
      </div>

      <button class="btn btn-red full" type="submit">Change password</button>
    </form>

    <div class="auth-foot">
      <a href="{% url 'accounts:user-login' %}">Back to sign in</a>
    </div>
  </section>
</main>

{% endblock %}
