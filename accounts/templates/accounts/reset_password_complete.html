{% extends 'base.html' %}
{% load static %}

{% block title %}Password Reset Complete{% endblock %}

{% block extra_header %}
<link href="{% static 'accounts/css/auth.css' %}" rel="stylesheet">
{% endblock %}

{% block content %}

<main class="auth-wrap">
  <section class="auth-card text-center">
    <h1>Password reset complete</h1>
    <p class="sub">Your password has been set. You can now sign in with your new password.</p>
    
    <a href="{% url 'accounts:user-login' %}" class="btn btn-red full">Sign in</a>
  </section>
</main>

{% endblock %}
