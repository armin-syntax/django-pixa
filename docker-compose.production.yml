services:
  web:
    image: arminsyntax/django-pixa:1.0.0

    container_name: pixa-web
    restart: unless-stopped

    command: gunicorn --bind 0.0.0.0:8000 config.wsgi:application

    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media

    expose:
      - "8000"

    networks:
      - pixa-network


  db:
    image: postgres:16-alpine

    container_name: pixa-db
    restart: unless-stopped

    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - pixa-network


  nginx:
    image: nginx:alpine

    container_name: pixa-nginx
    restart: unless-stopped

    depends_on:
      - web

    ports:
      - "80:80"

    volumes:
      - ./nginx/pixa.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro

    networks:
      - pixa-network


volumes:
  postgres_data:
  static_data:
  media_data:


networks:
  pixa-network:
    driver: bridge
