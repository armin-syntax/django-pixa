<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Upload — Pixa</title>
    <meta name="description" content="Pixa is a minimal visual discovery platform for photography and personal collections.">
    <link rel="stylesheet" href="assets/css/public.css">
    <link rel="stylesheet" href="assets/css/upload.css">
  </head>
  <body>
    <!--
    <div class="messages-container" aria-live="polite">
      <div class="alert alert-success">Success message</div>
      <div class="alert alert-info">Information message</div>
      <div class="alert alert-warning">Warning message</div>
      <div class="alert alert-danger">Error message</div>
    </div>
    -->
    <header class="topbar">
      <a class="logo" href="index.html" aria-label="Pixa home">p</a>
      <form class="search-form" action="" method="GET" role="search">
        <input class="search" type="search" placeholder="Search..." aria-label="Search">
      </form>
      <nav class="nav">
        <a href="index.html">Explore</a>
        <a href="about.html">About</a>
      </nav>
      <a class="avatar" href="profile.html" aria-label="Profile">A</a>
    </header>

    <main class="upload-page">
      <section class="upload-card">
        <div class="upload-heading">
          <div class="eyebrow">Share something beautiful</div>
          <h1>Upload photo</h1>
          <p>Add a new photo to your collection.</p>
        </div>

        <form action="" method="POST" enctype="multipart/form-data" class="upload-form">
          <!-- <div class="errors-container"><div class="alert alert-danger">Error message</div><div class="alert alert-info">Information message</div></div> -->
          <div class="form-group">
            <label for="photo">Photo</label>
            <div class="file-field">
              <input id="photo" name="image" type="file" accept="image/jpeg,image/png,image/webp" required="">
              <span id="file-name">Choose a photo...</span>
            </div>
          </div>

          <div class="form-group">
            <label for="title">Title</label>
            <input id="title" name="title" class="field" type="text" maxlength="100" placeholder="Give your photo a title" required="">
          </div>

          <div class="form-group">
            <div class="label-row">
              <label for="caption">Caption</label>
              <span id="caption-count" class="counter">0 / 200</span>
            </div>
            <textarea id="caption" name="caption" class="field" maxlength="200" placeholder="Write a short caption...">
            </textarea>
          </div>

          <div class="form-group">
            <label for="tag-input">Tags</label>
            <div class="tags-input">
              <div id="selected-tags" class="selected-tags">
              </div>
              <input id="tag-input" type="text" placeholder="Add a tag..." autocomplete="off">
            </div>
            <div id="tag-suggestions" class="tag-suggestions">
            </div>
            <div id="tag-hidden-inputs">
            </div>
          </div>

          <div class="upload-actions">
            <a href="profile.html" class="btn btn-outline">Cancel</a>
            <button type="submit" class="btn btn-red">Upload photo</button>
          </div>
        </form>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer-inner">
        <span>© 2026 Pixa</span>
        <span>
          <a href="about.html">About</a>
          <span class="footer-dot">·</span>
          <a href="login.html">Login</a>
          <span class="footer-dot">·</span>
          <a href="register.html">Sign up</a>
        </span>
      </div>
    </footer>

    <script src="assets/js/public.js">
    </script>
    <script src="assets/js/upload.js">
    </script>
  </body>
</html>
