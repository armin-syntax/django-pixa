{% extends 'base.html' %}
{% load static %}

{% block title %}Email Sent{% endblock %}

{% block extra_header %}
<link href="{% static 'accounts/css/auth.css' %}" rel="stylesheet">
{% endblock %}

{% block content %}

<main class="auth-wrap">
  <section class="auth-card text-center">
    <div class="success-icon">📧</div>
    <h1>Check your email</h1>
    <p class="sub">We've sent you a link to reset your password.</p>
    <p class="muted">If you don't see it, check your spam folder.</p>
    
    <div class="auth-foot">
      <a href="{% url 'accounts:user-login' %}">Back to sign in</a>
    </div>
  </section>
</main>

{% endblock %}
