{% load static %}

<header class="topbar">
  <a href="{% url 'photos:photos' %}" aria-label="Pixa home" class="logo">
    <img src="{% static 'public/images/p_icon.png' %}" alt="Pixa"/>
  </a>
  
  <form action="{% url 'photos:photos' %}" method="GET" role="search" class="search-form">
    <input
      aria-label="Search"
      class="search"
      placeholder="Search..."
      type="search"
      name="search"
      autocomplete="off"
      value="{{ request.GET.search }}"
    >
  </form>
  
  <nav class="nav">
    <a href="{% url 'photos:photos' %}">Explore</a>
    <a href="{% url 'about' %}">About</a>
  </nav>
  
  {% if request.user.is_authenticated %}
    <a href="{{ request.user.get_profile_url }}" aria-label="Profile" class="avatar">{{ request.user.full_name|first }}</a>
  {% else %}
    <a href="{% url 'accounts:user-login' %}" aria-label="User Login" class="avatar">?</a>
  {% endif %}
</header>
